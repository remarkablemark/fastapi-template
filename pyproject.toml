[project]
name = "fastapi-template"
version = "0.0.0"
authors = [
    { name="Mark", email="mark@remarkablemark.org" },
]
description = "FastAPI Template"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi[standard]>=0.137.1,<1.0.0",
]

[dependency-groups]
dev = [
    "coverage==7.14.1",
    "mypy>=2.1.0,<3.0.0",
    "pre-commit==4.6.0",
    "pyright==1.1.410",
    "pytest==9.1.0",
    "ruff==0.15.18",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
]

[project.urls]
Homepage = "https://github.com/remarkablemark/fastapi-template"
Issues = "https://github.com/remarkablemark/fastapi-template/issues"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # no print statements
]
ignore = [
    "E501",  # line too long, handled by ruff
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"
fail_under = 100

[tool.coverage.html]
show_contexts = true

[tool.pyright]
include = ["app", "tests"]
exclude = ["venv", ".venv", "alembic"]
strict = ["app/**"]
typeCheckingMode = "strict"
